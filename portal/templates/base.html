<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CeciChic Print Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
    .nav { background: #0f172a; color: #fff; padding: 0 1.5rem; display: flex; align-items: center; gap: 2rem; height: 52px; }
    .nav-brand { font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; }
    .nav a { color: #94a3b8; text-decoration: none; font-size: 0.875rem; padding: 0.25rem 0; }
    .nav a:hover, .nav a.active { color: #fff; }
    .main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card-title { font-weight: 600; font-size: 1rem; margin-bottom: 1rem; color: #0f172a; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .badge { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.25rem 0.625rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
    .badge-ok { background: #dcfce7; color: #166534; }
    .badge-err { background: #fee2e2; color: #991b1b; }
    .badge-warn { background: #fef9c3; color: #854d0e; }
    .badge-neutral { background: #f1f5f9; color: #475569; }
    .kpi-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .kpi { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1rem 1.5rem; flex: 1; min-width: 120px; }
    .kpi-val { font-size: 1.75rem; font-weight: 700; color: #0f172a; }
    .kpi-lbl { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
    input, select { width: 100%; height: 2.5rem; border: 1px solid #cbd5e1; border-radius: 6px; padding: 0 0.75rem; font-size: 0.875rem; background: #fff; color: #0f172a; }
    input:focus, select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px #e0e7ff; }
    .form-group { margin-bottom: 1rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; height: 2.375rem; padding: 0 1rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; }
    .btn-primary { background: #0f172a; color: #fff; }
    .btn-primary:hover { background: #1e293b; }
    .btn-secondary { background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .alert { padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem; }
    .alert-ok { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-err { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .mono { font-family: monospace; font-size: 0.8rem; background: #f8fafc; padding: 0.75rem; border-radius: 6px; border: 1px solid #e2e8f0; word-break: break-all; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-ok { background: #22c55e; }
    .dot-err { background: #ef4444; }
    .dot-warn { background: #f59e0b; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<nav class="nav">
  <span class="nav-brand">🖨 CeciChic Print Agent</span>
  <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Dashboard</a>
  <a href="/config" {% if request.path == '/config' %}class="active"{% endif %}>Configuración</a>
</nav>
<main class="main">
  {% block content %}{% endblock %}
</main>
</body>
</html>
